{% extends "base.html" %}

{% block content %}
<table class="table table-striped table-hover" id="data">
    <thead>
    <tr>
        <th>Member</th>
        <th class="numeric">Value</th>
    </tr>
    </thead>
    <tbody>
    {% for record in records %}
    <tr>
        <td>{{ record.member }}</td>
        <td class="numeric">{{ "{:,}".format(record.value) + (percent or "") }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
